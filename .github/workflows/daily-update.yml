name: Daily Data Update
# Runs entirely on GitHub's own servers -- no dependency on your computer
# being on, logged in, or even powered on.
#
# UPDATED: instead of one fixed-time run guessing when NSE has published,
# this polls every 5 minutes for BOTH of NSE's daily files -- the stock
# bhavcopy AND the index-close file -- to actually be available, and only
# runs the full pipeline once BOTH are live. Checking bhavcopy alone was a
# real bug: some days NSE publishes it before the index-close file, and a
# gate that only checked bhavcopy would run the whole pipeline early,
# permanently miss that day's sector/Nifty index prices (no retry once
# the day's commit lands), and leave the Sectoral Indices tab stuck a day
# behind every other tab. Now both must return 200 with a real body
# before proceed=true.
#
# The original 6:30pm run is kept as an UNCONDITIONAL fallback -- it
# always attempts the full pipeline regardless of the check (same
# behavior as before this change), so if NSE is ever later than the poll
# window, you still get today's update guaranteed. Weekends/holidays
# still fire and just get the same graceful "[miss] ... holiday" handling
# fetch_data.py already has -- harmless, a few wasted seconds those days.
#
# UPDATED AGAIN: poll window extended and the fallback pushed later --
# NSE's bhavcopy (the file every tab except Sectors depends on) doesn't
# always land by 6:30pm IST; when it's late, the old 6:30pm-only fallback
# meant the site sat on yesterday's stock-level data for a FULL EXTRA DAY
# (nothing else was scheduled until tomorrow's poll). Now polling
# continues to ~9:25pm IST and the unconditional fallback moved to 9:00pm
# IST, so a late bhavcopy still gets picked up the same evening in the
# large majority of cases.
#
# GitHub Actions cron is UTC:
#   */5 11-15 * * 1-5   -> every 5 min, 11:00-15:55 UTC = 4:30pm-9:25pm IST (poll)
#   30 15 * * 1-5        -> 15:30 UTC = 9:00pm IST (unconditional fallback)
#
# Idempotency: SCHEDULED triggers (the 5-minute poll and the 9pm
# fallback) first check today's date against the most recent commit
# message on this branch -- if an earlier poll already caught today's
# update, the run exits in a couple seconds without re-running
# classification/fetch/export/push. This is what keeps 5-minute polling
# cheap. Only one scheduled run per day actually ends up running the
# full pipeline.
#
# MANUAL (workflow_dispatch) runs are DIFFERENT on purpose: they always
# proceed, regardless of what today's commit history already says. This
# was a real bug -- a manual "Force full re-classification" run
# triggered after that day's automated commit already landed (e.g. to
# retry classification failures from a screener.in outage) used to get
# silently skipped by the same-day check, with no way to actually run
# it again until the UTC date rolled over. A person clicking "Run
# workflow" has already decided they want it to run right now; the
# same-day guard exists to stop the unattended poll from re-running
# itself, not to second-guess a deliberate manual trigger.
#
# Honest caveat, straight from GitHub's own docs: scheduled workflows can
# be delayed during periods of high load across GitHub -- usually by a
# few minutes, occasionally longer, and 5-minute cron isn't always exact
# to the minute either. Still far better than a hardcoded guess.
on:
  schedule:
    - cron: "*/5 11-15 * * 1-5"   # poll: 4:30pm-9:25pm IST, every 5 min
    - cron: "30 15 * * 1-5"       # unconditional fallback: 9:00pm IST
  workflow_dispatch:
    inputs:
      mode:
        description: "How this run behaves. manual (default) = always runs, for you clicking Run workflow. poll / fallback = used ONLY by the outside scheduler (cron-job.org): poll behaves like the 5-min GitHub poll (same-day guard + waits for both NSE files); fallback behaves like the late-evening unconditional run (same-day guard, then runs regardless of NSE)."
        required: false
        type: choice
        options:
          - manual
          - poll
          - fallback
        default: manual
      force_reclassify:
        description: "Force full re-classification (tick this once a month, or after a known industry change -- otherwise leave unticked for the normal daily run)"
        required: false
        type: boolean
        default: false
      clear_dates:
        description: "Space-separated YYYY-MM-DD date(s) to purge from the cached database before this run -- use to fix a date that got stored under the wrong label (e.g. a holiday that NSE served stale content for). Leave blank for a normal run."
        required: false
        type: string
        default: ""
# Never let two runs overlap (outside-scheduler polls + GitHub's own late
# scheduled runs could otherwise race on the same git push / DB cache).
concurrency:
  group: daily-update
  cancel-in-progress: false
permissions:
  contents: write   # needed to commit the regenerated data files back to the repo
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check whether to run today's update
        id: gate
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ -z "$MODE" ] || [ "$MODE" = "manual" ]; }; then
            echo "Manual run -- always proceeds, regardless of today's commit history or NSE publish status."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(date -u +'%Y-%m-%d')
          LAST_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")

          if echo "$LAST_MSG" | grep -q "$TODAY"; then
            echo "Already updated today (last commit: \"$LAST_MSG\") -- skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.schedule }}" = "30 15 * * 1-5" ] || [ "$MODE" = "fallback" ]; then
            echo "Late-evening fallback -- proceeding regardless of NSE publish status."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DDMM=$(date -u +'%d%m%Y')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          BHAV_FNAME="sec_bhavdata_full_${DDMM}.csv"
          BHAV_URL="https://archives.nseindia.com/products/content/${BHAV_FNAME}"
          BHAV_RESULT=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" \
            -A "$UA" -H "Accept: text/csv,application/csv,*/*" "$BHAV_URL")
          BHAV_CODE=$(echo "$BHAV_RESULT" | cut -d' ' -f1)
          BHAV_BYTES=$(echo "$BHAV_RESULT" | cut -d' ' -f2)
          echo "NSE check for $BHAV_FNAME: status=$BHAV_CODE, bytes=$BHAV_BYTES"

          IDX_FNAME="ind_close_all_${DDMM}.csv"
          IDX_URL="https://archives.nseindia.com/content/indices/${IDX_FNAME}"
          IDX_RESULT=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" \
            -A "$UA" -H "Accept: text/csv,application/csv,*/*" "$IDX_URL")
          IDX_CODE=$(echo "$IDX_RESULT" | cut -d' ' -f1)
          IDX_BYTES=$(echo "$IDX_RESULT" | cut -d' ' -f2)
          echo "NSE check for $IDX_FNAME: status=$IDX_CODE, bytes=$IDX_BYTES"

          if [ "$BHAV_CODE" = "200" ] && [ "$BHAV_BYTES" -gt 0 ] && [ "$IDX_CODE" = "200" ] && [ "$IDX_BYTES" -gt 0 ]; then
            echo "Both bhavcopy and index-close files are live -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not both published yet (bhavcopy=$BHAV_CODE, index=$IDX_CODE) -- will check again in 5 min (or fall back to 9pm)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # sector_strength.db isn't committed to the repo (and shouldn't
      # be -- it's a growing binary file that changes every run). Instead
      # it's cached between runs: restore whatever the last run saved,
      # then save a fresh copy at the end of this one. restore-keys uses
      # a prefix match, so it always picks up the most recent cache
      # regardless of which exact run produced it.
      - name: Restore database from cache
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: sector_strength.db
          key: sector-strength-db-${{ github.run_id }}
          restore-keys: |
            sector-strength-db-

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install pandas requests beautifulsoup4 curl_cffi

      - name: Clear bad date(s) from database
        if: steps.gate.outputs.proceed == 'true' && github.event.inputs.clear_dates != ''
        run: python clear_price_dates.py ${{ github.event.inputs.clear_dates }}

      - name: Classify basic industries
        if: steps.gate.outputs.proceed == 'true'
        run: |
          if [ "${{ github.event.inputs.force_reclassify }}" = "true" ]; then
            echo "Force reclassify requested -- re-walking all industries (this run will take longer than usual)"
            python classify_via_screener.py --force
          else
            python classify_via_screener.py
          fi

      - name: Record latest data date before fetch
        id: before
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sqlite3
          last = ""
          if os.path.exists("sector_strength.db"):
              c = sqlite3.connect("sector_strength.db")
              for t in ("stock_prices", "index_prices"):
                  try:
                      d = c.execute(f"SELECT MAX(date) FROM {t}").fetchone()[0] or ""
                      last = max(last, d)
                  except sqlite3.Error:
                      pass
          print(f"last={last}")
          PY

      - name: Fetch data
        if: steps.gate.outputs.proceed == 'true'
        run: python fetch_data.py

      # If fetch_data.py stored no new trading day (holiday, or NSE not
      # published), skip apply/export/commit/"updated" message so nothing
      # on the site is recomputed against an unchanged data date.
      # Manual runs always continue (force-reclassify / clear_dates).
      - name: Check whether new market data arrived
        id: newdata
        if: steps.gate.outputs.proceed == 'true'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ -z "$MODE" ] || [ "$MODE" = "manual" ]; }; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AFTER=$(python - <<'PY'
          import sqlite3
          c = sqlite3.connect("sector_strength.db")
          last = ""
          for t in ("stock_prices", "index_prices"):
              try:
                  d = c.execute(f"SELECT MAX(date) FROM {t}").fetchone()[0] or ""
                  last = max(last, d)
              except sqlite3.Error:
                  pass
          print(last)
          PY
          )
          echo "Latest date before fetch: '${{ steps.before.outputs.last }}', after: '$AFTER'"
          if [ "$AFTER" != "${{ steps.before.outputs.last }}" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new trading day stored -- skipping export, commit and 'updated' notification."
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      # Must run AFTER fetch_data.py (needs today's prices already in
      # stock_prices to know what to back-adjust) and BEFORE export_snapshot.py
      # (so the exported EMA/breadth/RS numbers reflect adjusted prices, not
      # raw ones). --apply is required here -- without it this only prints a
      # dry-run preview and never touches the DB, which would silently
      # defeat the whole point of running it on a schedule.
      - name: Apply corporate actions (bonus/split back-adjustment)
        if: steps.gate.outputs.proceed == 'true' && steps.newdata.outputs.new == 'true'
        run: python apply_corporate_actions.py --apply

      - name: Export snapshot
        if: steps.gate.outputs.proceed == 'true' && steps.newdata.outputs.new == 'true'
        run: python export_snapshot.py

      - name: Save database to cache
        if: steps.gate.outputs.proceed == 'true' && steps.newdata.outputs.new == 'true'
        uses: actions/cache/save@v4
        with:
          path: sector_strength.db
          key: sector-strength-db-${{ github.run_id }}

      - name: Commit and push updated data
        if: steps.gate.outputs.proceed == 'true' && steps.newdata.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Automated daily update $(date -u +'%Y-%m-%d')"
          git push

      - name: Notify via Telegram
        if: steps.gate.outputs.proceed == 'true' && steps.newdata.outputs.new == 'true' && success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="Sector strength site updated"

      - name: Notify via Telegram on failure
        if: steps.gate.outputs.proceed == 'true' && failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="⚠️ Sector strength update FAILED — check GitHub Actions logs"

      - name: Notify via Telegram when no new data (outside-scheduler fallback only)
        if: steps.gate.outputs.proceed == 'true' && steps.newdata.outputs.new == 'false' && github.event.inputs.mode == 'fallback' && success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="Sector strength: no new market data today (likely holiday) - site not updated"
